name: sync

on:
  workflow_dispatch:
    inputs:
      channel:
        default: prod-stable
        description: |
          The name of the release channel.
          One of: [prod-stable, prod-staging]

# Automatically cancel in-progress actions on the same branch
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request_target' && github.head_ref || github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        ref: ${{ inputs.channel }}

    - name: Install Go
      uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
      with:
        go-version: 1.27.4

    - name: Install uv
      uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      with:
        version: 0.13.8
        enable-cache: true

    - name: Generate
      shell: bash
      env:
        CHANNEL: ${{ inputs.channel }}
      run: |
        make generate

    - name: Show diff
      shell: bash
      run: |
        git diff

    - name: Generate branch ID
      id: id
      run: |
        BRANCH="sync/$(date +'%Y%m%d%H%M%S')"
        echo "name=${BRANCH}" >>"${GITHUB_OUTPUT}"

    - name: Create pull request
      uses: peter-evans/create-pull-request@3ffccacd46053766916f087ce41d627c0b8cf2d1 # v8.1.3
      with:
        token: ${{ secrets.GH_PAT }}
        base: ${{ inputs.channel }}
        commit-message: "chore: Update Python SDK from OpenAPI spec"
        title: "chore: Update Python SDK from OpenAPI spec"
        branch: ${{ steps.id.outputs.name }}
        committer: Unikraft Bot <monkey@unikraft.io>
        author: Unikraft Bot <monkey@unikraft.io>
        # The whole generated package, so a module the spec drops is removed and
        # a tag it adds is not left out of the pull request.
        add-paths: src/unikraft_cloud/api
        signoff: true
